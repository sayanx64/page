<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sayan@arch ~ hyprland</title>
<meta name="description" content="Sayan Pal — CS undergrad at KIIT. Interactive desktop portfolio simulating Hyprland on Arch Linux.">
<meta property="og:title" content="sayan@arch — portfolio">
<meta property="og:description" content="Interactive Hyprland desktop portfolio with a sakura-themed window manager simulation">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;1,300&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<body>
<canvas id="wp"></canvas>

<div id="m-notice">
  <div style="font-size:2rem">🌸</div>
  <h2>desktop only</h2>
  <p>this is a full hyprland desktop simulation.<br>please open on a desktop browser.<br><br>github.com/sayanx64</p>
</div>

<!-- WAYBAR -->
<div id="waybar">
  <div class="wb-l">
    <div class="wb-icon" id="launcher-btn" title="App Launcher (/)">

    </div>
    <div class="wb-sep"></div>
    <div class="ws-row" id="ws-row"></div>
    <div class="wb-sep"></div>
    <div class="wb-title" id="wb-title">sayan@arch</div>
  </div>
  <div class="wb-c" id="wb-time">00:00</div>
  <div class="wb-r">
    <div class="wb-stat">
      <svg viewBox="0 0 16 16"><path d="M2 10l3-3 3 3 4-5 2 2"/></svg>
      <span class="v" id="s-cpu">—</span>
    </div>
    <div class="wb-stat">
      <svg viewBox="0 0 16 16"><rect x="3" y="5" width="10" height="8" rx="1"/><path d="M5 5V3.5A3 3 0 0 1 11 3.5V5"/></svg>
      <span class="v" id="s-ram">—</span>
    </div>
    <div class="wb-sep"></div>
    <div class="wb-stat">
      <svg viewBox="0 0 16 16"><path d="M3 11c0-2.8 2.2-5 5-5s5 2.2 5 5"/><path d="M5 11c0-1.7 1.3-3 3-3s3 1.3 3 3"/><circle cx="8" cy="11" r="1"/></svg>
      <span class="v">arch</span>
    </div>
    <div class="wb-sep"></div>
    <div class="wb-stat">
      <svg viewBox="0 0 16 16"><path d="M1 6.5h3v7H1zM6 4h3v9.5H6zM11 2h3v11.5h-3z"/></svg>
      <span class="v" id="s-vol">72</span>
    </div>
    <div class="wb-sep"></div>
    <div class="wb-stat">
      <svg viewBox="0 0 16 16"><rect x="1" y="4.5" width="12" height="7" rx="1.5"/><path d="M13 7v2h1.5V7z"/></svg>
      <span class="v" id="s-bat">—</span>
    </div>
  </div>
</div>

<!-- DESKTOP -->
<div id="desktop"></div>

<!-- LAUNCHER -->
<div id="launcher">
  <div class="lbox">
    <div class="l-search">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" width="15" height="15"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
      <input id="l-input" placeholder="Search apps..." autocomplete="off" spellcheck="false">
    </div>
    <div class="l-results" id="l-results"></div>
    <div class="l-hint"><span>↑↓ navigate</span><span>↵ open</span><span>esc close</span></div>
  </div>
</div>

<!-- CONTEXT MENU -->
<div id="ctx">
  <div class="ctx-i" data-a="launcher"><svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>App Launcher</div>
  <div class="ctx-i" data-a="terminal"><svg viewBox="0 0 16 16"><rect x="1" y="2" width="14" height="11" rx="1.5"/><path d="M4 6l2.5 2L4 10M8.5 10H12"/></svg>Terminal</div>
  <div class="ctx-s"></div>
  <div class="ctx-i" data-a="wp"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 2a6 6 0 0 1 0 12"/></svg>Cycle Wallpaper</div>
  <div class="ctx-s"></div>
  <div class="ctx-i" data-a="gh"><svg viewBox="0 0 16 16"><path d="M8 1C4.1 1 1 4.1 1 8c0 3.1 2 5.7 4.8 6.6.4.1.5-.2.5-.4v-1.3c-2 .4-2.4-1-2.4-1-.3-.8-.8-1-.8-1-.6-.4.1-.4.1-.4.7 0 1.1.7 1.1.7.6 1.1 1.7.8 2.1.6.1-.5.2-.8.4-.9-1.6-.2-3.2-.8-3.2-3.5 0-.8.3-1.4.7-1.9-.1-.2-.3-.9.1-1.9 0 0 .6-.2 1.9.7a6.6 6.6 0 0 1 3.5 0c1.3-.9 1.9-.7 1.9-.7.4 1 .2 1.7.1 1.9.5.5.7 1.1.7 1.9 0 2.7-1.6 3.3-3.2 3.5.3.2.5.7.5 1.4v2.1c0 .2.1.5.5.4C13 13.7 15 11.1 15 8c0-3.9-3.1-7-7-7z"/></svg>GitHub</div>
  <div class="ctx-i" data-a="li"><svg viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" rx="2"/><path d="M5 6.5v4M5 4.5v.5M7 10.5V8a1.5 1.5 0 0 1 3 0v2.5M10 10.5V8"/></svg>LinkedIn</div>
</div>

<!-- DOCK -->
<div id="dock">
  <div class="dk-item" data-app="terminal" id="dk-terminal">
    <svg viewBox="0 0 20 20"><rect x="1.5" y="3" width="17" height="13" rx="2"/><path d="M5 8l3 2.5L5 13M10.5 13H15"/></svg>
    <span class="dk-tt">Terminal</span>
  </div>
  <div class="dk-item" data-app="about" id="dk-about">
    <svg viewBox="0 0 20 20"><circle cx="10" cy="7" r="3.5"/><path d="M3.5 17.5c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5"/></svg>
    <span class="dk-tt">About</span>
  </div>
  <div class="dk-item" data-app="projects" id="dk-projects">
    <svg viewBox="0 0 20 20"><path d="M2 5.5h5.5l2 2H18v10H2z"/></svg>
    <span class="dk-tt">Projects</span>
  </div>
  <div class="dk-item" data-app="research" id="dk-research">
    <svg viewBox="0 0 20 20"><path d="M5 2h6.5l4.5 4.5V18H5z"/><path d="M11.5 2v4.5H16"/><path d="M7.5 10h5M7.5 13h5"/></svg>
    <span class="dk-tt">Research</span>
  </div>
  <div class="dk-sep"></div>
  <div class="dk-item" data-app="files" id="dk-files">
    <svg viewBox="0 0 20 20"><path d="M2 4h6l2 2h8v11H2z"/><path d="M2 6h16"/></svg>
    <span class="dk-tt">Files</span>
  </div>
  <div class="dk-item" data-app="editor" id="dk-editor">
    <svg viewBox="0 0 20 20"><path d="M6 5L2.5 10 6 15M14 5l3.5 5L14 15M11 3l-2 14"/></svg>
    <span class="dk-tt">Editor</span>
  </div>
  <div class="dk-item" data-app="notes" id="dk-notes">
    <svg viewBox="0 0 20 20"><rect x="3" y="2" width="14" height="16" rx="2"/><path d="M6.5 6h7M6.5 9.5h7M6.5 13h4"/></svg>
    <span class="dk-tt">Notes</span>
  </div>
  <div class="dk-sep"></div>
  <div class="dk-item" id="dk-launcher">
    <svg viewBox="0 0 20 20"><circle cx="4.5" cy="4.5" r="2"/><circle cx="10" cy="4.5" r="2"/><circle cx="15.5" cy="4.5" r="2"/><circle cx="4.5" cy="10" r="2"/><circle cx="10" cy="10" r="2"/><circle cx="15.5" cy="10" r="2"/><circle cx="4.5" cy="15.5" r="2"/><circle cx="10" cy="15.5" r="2"/><circle cx="15.5" cy="15.5" r="2"/></svg>
    <span class="dk-tt">Launcher</span>
  </div>
</div>

<script src="wallpaper.js"></script>
<script src="wm.js"></script>
<script src="terminal.js"></script>
<script src="apps.js"></script>
<script src="main.js"></script>
</body>
</html>
